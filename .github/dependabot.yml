version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /services/api
      - /services/worker
      - /services/results
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/worker
      - /services/results
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/platform
      - /infra/data
      - /infra/ci
    schedule:
      interval: monthly
