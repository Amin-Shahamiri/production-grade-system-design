<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">DocSummarizer architecture</title><desc id="d">A user sends a document to the api service on EKS. The api stores the file in S3 and a record in Postgres, then puts a job in an SQS queue. The worker reads the job and the file, asks a Bedrock model for a summary, and saves it in DynamoDB. The results service reads the summary from Redis or DynamoDB.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#8c959f;--pf:#eeedfe;--ps:#7f77dd;--tf:#e1f5ee;--ts:#1d9e75;--gf:#f6f8fa;--gs:#8c959f;--dot:#d4537e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#6e7681;--pf:#2a2650;--ps:#a79cf2;--tf:#0d3b2e;--ts:#3ecf9a;--gf:#161b22;--gs:#6e7681;--dot:#ff7aa8}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}
.t{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.s{font-size:11px;text-anchor:middle;dominant-baseline:central;fill:var(--muted)}
.lab{font-size:12px;fill:var(--muted)}
.svc{fill:var(--pf);stroke:var(--ps);stroke-width:1.3}
.store{fill:var(--tf);stroke:var(--ts);stroke-width:1.3}
.ext{fill:var(--gf);stroke:var(--gs);stroke-width:1.3}
.plan{fill:var(--gf);stroke:var(--gs);stroke-width:1.3;stroke-dasharray:5 4}
.cluster{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 4}
.edge{stroke:var(--line);stroke-width:1.2;fill:none;opacity:.5}
.pedge{stroke:var(--line);stroke-width:1.2;fill:none;opacity:.5;stroke-dasharray:5 4}
.dot{fill:var(--dot)}
.cap{font-size:15px;text-anchor:middle}
.static{display:none;font-size:14px;text-anchor:middle;fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.dot,.cap{display:none}.static{display:block}}
</style><rect class="bg" width="900" height="540" rx="12"/><rect class="cluster" x="320" y="24" width="380" height="416" rx="14"/><text class="lab" x="334" y="44">Amazon EKS, namespace: staging</text><text class="lab" x="805" y="18" text-anchor="middle">AWS managed services</text><path class="pedge" d="M110,249 L145,249"/><path class="pedge" d="M285,249 L350,119"/><path class="pedge" d="M285,249 L350,379"/><path class="edge" d="M470,119 L730,54"/><path class="edge" d="M470,119 L730,119"/><path class="edge" d="M470,119 L730,184"/><path class="edge" d="M470,249 L730,119"/><path class="edge" d="M470,249 L730,184"/><path class="edge" d="M470,249 L730,249"/><path class="edge" d="M470,249 L730,314"/><path class="edge" d="M470,379 L730,314"/><path class="edge" d="M470,379 L730,379"/><rect class="ext" x="15" y="224" width="95" height="50" rx="8"/><text class="t" x="62.5" y="249">User</text><rect class="plan" x="145" y="219" width="140" height="60" rx="8"/><text class="t" x="215" y="241">CloudFront + WAF</text><text class="s" x="215" y="260">planned</text><rect class="svc" x="350" y="94" width="120" height="50" rx="8"/><text class="t" x="410" y="111">api</text><text class="s" x="410" y="130">uploads</text><rect class="svc" x="350" y="224" width="120" height="50" rx="8"/><text class="t" x="410" y="241">worker</text><text class="s" x="410" y="260">makes summaries</text><rect class="svc" x="350" y="354" width="120" height="50" rx="8"/><text class="t" x="410" y="371">results</text><text class="s" x="410" y="390">serves results</text><rect class="store" x="730" y="32" width="150" height="44" rx="8"/><text class="t" x="805" y="46">RDS Postgres</text><text class="s" x="805" y="65">document records</text><rect class="store" x="730" y="97" width="150" height="44" rx="8"/><text class="t" x="805" y="111">SQS queue</text><text class="s" x="805" y="130">and dead-letter queue</text><rect class="store" x="730" y="162" width="150" height="44" rx="8"/><text class="t" x="805" y="176">S3 bucket</text><text class="s" x="805" y="195">uploaded files</text><rect class="store" x="730" y="227" width="150" height="44" rx="8"/><text class="t" x="805" y="241">Bedrock</text><text class="s" x="805" y="260">Claude Haiku 4.5</text><rect class="store" x="730" y="292" width="150" height="44" rx="8"/><text class="t" x="805" y="306">DynamoDB</text><text class="s" x="805" y="325">job results</text><rect class="store" x="730" y="357" width="150" height="44" rx="8"/><text class="t" x="805" y="371">ElastiCache Redis</text><text class="s" x="805" y="390">cache and rate limit</text><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="0s" repeatCount="indefinite" path="M110,249 L285,249 L350,119" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="2s" repeatCount="indefinite" path="M470,119 L730,184" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="4s" repeatCount="indefinite" path="M470,119 L730,54" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="6s" repeatCount="indefinite" path="M470,119 L730,119" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="8s" repeatCount="indefinite" path="M730,119 L470,249" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="10s" repeatCount="indefinite" path="M470,249 L730,184" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="12s" repeatCount="indefinite" path="M470,249 L730,249" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="14s" repeatCount="indefinite" path="M470,249 L730,314" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="16s" repeatCount="indefinite" path="M110,249 L285,249 L350,379" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="16s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="18s" repeatCount="indefinite" path="M470,379 L730,379" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="18s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="18s" repeatCount="indefinite" path="M470,379 L730,314" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="18s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><text class="cap" x="450" y="482" opacity="0">1. A user sends a text document to the api<animate attributeName="opacity" dur="22s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">2. The api saves the file in S3<animate attributeName="opacity" dur="22s" begin="2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">3. The api saves a record in Postgres<animate attributeName="opacity" dur="22s" begin="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">4. The api puts a small job in the queue, then answers: accepted<animate attributeName="opacity" dur="22s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">5. The worker takes the job from the queue<animate attributeName="opacity" dur="22s" begin="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">6. The worker reads the file from S3<animate attributeName="opacity" dur="22s" begin="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">7. The worker asks the model for a summary<animate attributeName="opacity" dur="22s" begin="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">8. The worker saves the result in DynamoDB<animate attributeName="opacity" dur="22s" begin="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">9. The user asks for the result<animate attributeName="opacity" dur="22s" begin="16s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="482" opacity="0">10. The results service checks Redis, then DynamoDB, and answers the owner only<animate attributeName="opacity" dur="22s" begin="18s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="lab" x="16" y="524">Dashed outline: planned, not built yet. The moving dot is one document.</text><text class="static" x="450" y="482">Request path: user, api, queue, worker, model, DynamoDB, results</text></svg>