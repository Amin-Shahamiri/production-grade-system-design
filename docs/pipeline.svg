<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Delivery pipeline</title><desc id="d">A developer opens a pull request. CI runs tests and scans. After the merge, CI builds three images, gets AWS access with OIDC, and pushes them to ECR. Argo CD deploys the image tag written in the deploy folder to EKS.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#8c959f;--pf:#eeedfe;--ps:#7f77dd;--tf:#e1f5ee;--ts:#1d9e75;--gf:#f6f8fa;--gs:#8c959f;--dot:#d4537e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#6e7681;--pf:#2a2650;--ps:#a79cf2;--tf:#0d3b2e;--ts:#3ecf9a;--gf:#161b22;--gs:#6e7681;--dot:#ff7aa8}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}
.t{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.s{font-size:11px;text-anchor:middle;dominant-baseline:central;fill:var(--muted)}
.lab{font-size:12px;fill:var(--muted)}
.svc{fill:var(--pf);stroke:var(--ps);stroke-width:1.3}
.store{fill:var(--tf);stroke:var(--ts);stroke-width:1.3}
.ext{fill:var(--gf);stroke:var(--gs);stroke-width:1.3}
.plan{fill:var(--gf);stroke:var(--gs);stroke-width:1.3;stroke-dasharray:5 4}
.cluster{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 4}
.edge{stroke:var(--line);stroke-width:1.2;fill:none;opacity:.5}
.pedge{stroke:var(--line);stroke-width:1.2;fill:none;opacity:.5;stroke-dasharray:5 4}
.dot{fill:var(--dot)}
.cap{font-size:15px;text-anchor:middle}
.static{display:none;font-size:14px;text-anchor:middle;fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.dot,.cap{display:none}.static{display:block}}
</style><rect class="bg" width="900" height="340" rx="12"/><rect class="ext" x="15" y="100" width="90" height="56" rx="8"/><text class="t" x="60" y="120">Developer</text><text class="s" x="60" y="139">git push</text><rect class="ext" x="140" y="100" width="90" height="56" rx="8"/><text class="t" x="185" y="120">Pull request</text><text class="s" x="185" y="139">a branch</text><rect class="ext" x="265" y="100" width="140" height="56" rx="8"/><text class="t" x="335" y="120">CI checks</text><text class="s" x="335" y="139">tests, secrets, scans</text><rect class="ext" x="435" y="100" width="90" height="56" rx="8"/><text class="t" x="480" y="120">main</text><text class="s" x="480" y="139">squash merge</text><rect class="ext" x="555" y="100" width="100" height="56" rx="8"/><text class="t" x="605" y="120">Build + push</text><text class="s" x="605" y="139">three images</text><rect class="store" x="690" y="100" width="90" height="56" rx="8"/><text class="t" x="735" y="120">ECR</text><text class="s" x="735" y="139">tag = commit ID</text><rect class="store" x="555" y="20" width="100" height="44" rx="8"/><text class="t" x="605" y="34">OIDC role</text><text class="s" x="605" y="53">no stored keys</text><rect class="plan" x="540" y="210" width="120" height="56" rx="8"/><text class="t" x="600" y="230">deploy/ values</text><text class="s" x="600" y="249">new tag (planned)</text><rect class="svc" x="690" y="210" width="80" height="56" rx="8"/><text class="t" x="730" y="238">Argo CD</text><rect class="svc" x="800" y="210" width="85" height="56" rx="8"/><text class="t" x="842.5" y="230">EKS</text><text class="s" x="842.5" y="249">staging</text><path class="edge" d="M105,128 L140,128"/><path class="edge" d="M230,128 L265,128"/><path class="edge" d="M405,128 L435,128"/><path class="edge" d="M525,128 L555,128"/><path class="edge" d="M655,128 L690,128"/><path class="edge" d="M605,100 L605,64"/><path class="edge" d="M660,238 L690,238"/><path class="edge" d="M770,238 L800,238"/><path class="edge" d="M842,210 L735,156"/><path class="pedge" d="M605,156 L605,210"/><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="0s" repeatCount="indefinite" path="M105,128 L140,128" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="2s" repeatCount="indefinite" path="M230,128 L405,128" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="4s" repeatCount="indefinite" path="M405,128 L435,128" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="6s" repeatCount="indefinite" path="M525,128 L555,128" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="8s" repeatCount="indefinite" path="M605,100 L605,64" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="10s" repeatCount="indefinite" path="M655,128 L690,128" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="12s" repeatCount="indefinite" path="M605,156 L605,210" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="14s" repeatCount="indefinite" path="M660,238 L690,238" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="16s" repeatCount="indefinite" path="M770,238 L800,238" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="16s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion dur="22s" begin="18s" repeatCount="indefinite" path="M842,210 L735,156" keyPoints="0;1;1" keyTimes="0;0.0636;1" calcMode="linear"/><animate attributeName="opacity" dur="22s" begin="18s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.005;0.0586;0.0636;1"/></circle><text class="cap" x="450" y="305" opacity="0">1. A developer opens a pull request<animate attributeName="opacity" dur="22s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">2. CI runs the tests, the secrets scan and the image scan<animate attributeName="opacity" dur="22s" begin="2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">3. All checks are green: the change is merged to main<animate attributeName="opacity" dur="22s" begin="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">4. CI builds the three images<animate attributeName="opacity" dur="22s" begin="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">5. CI gets short-lived AWS access with OIDC, no stored keys<animate attributeName="opacity" dur="22s" begin="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">6. CI pushes the images to ECR, tagged with the commit ID<animate attributeName="opacity" dur="22s" begin="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">7. Planned: CI writes the new image tag into deploy/<animate attributeName="opacity" dur="22s" begin="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">8. Argo CD sees the change in Git<animate attributeName="opacity" dur="22s" begin="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">9. Argo CD updates the cluster<animate attributeName="opacity" dur="22s" begin="16s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="cap" x="450" y="305" opacity="0">10. The nodes pull the new image from ECR<animate attributeName="opacity" dur="22s" begin="18s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.01;0.0849;0.0909;1"/></text><text class="lab" x="16" y="326">Dashed outline: planned, not built yet.</text><text class="static" x="450" y="305">Pipeline: pull request, checks, merge, build, ECR, Argo CD, EKS</text></svg>